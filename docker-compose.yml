services:
  postgres:
    image: postgres:17
    container_name: vibesprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibesprint
      POSTGRES_USER: vibesprint
      POSTGRES_PASSWORD: vibesprint
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
