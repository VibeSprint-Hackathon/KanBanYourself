spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vibesprint}
    username: ${SPRING_DATASOURCE_USERNAME:vibesprint}
    password: ${SPRING_DATASOURCE_PASSWORD:vibesprint}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080