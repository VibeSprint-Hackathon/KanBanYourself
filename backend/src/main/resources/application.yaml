spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/vibesprint}
    username: ${SPRING_DATASOURCE_USERNAME:vibesprint}
    password: ${SPRING_DATASOURCE_PASSWORD:vibesprint}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

app:
  github:
    enabled: ${GITHUB_SYNC_ENABLED:false}
    repository: ${GITHUB_REPOSITORY:VibeSprint-Hackathon/KanBanYourself}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    runtime-cache-only: ${GITHUB_RUNTIME_CACHE_ONLY:true}
    sync-delay-ms: ${GITHUB_SYNC_DELAY_MS:30000}
