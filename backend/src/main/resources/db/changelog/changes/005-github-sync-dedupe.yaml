databaseChangeLog:
  - changeSet:
      id: 005-github-sync-dedupe
      author: vibesprint
      changes:
        - sql:
            sql: |
              WITH ranked AS (
                SELECT id,
                       ROW_NUMBER() OVER (
                         PARTITION BY external_reference
                         ORDER BY id
                       ) AS row_number
                FROM quest
                WHERE external_reference IS NOT NULL
              )
              DELETE FROM quest q
              USING ranked r
              WHERE q.id = r.id
                AND r.row_number > 1;

              CREATE UNIQUE INDEX IF NOT EXISTS uq_quest_external_reference
                ON quest (external_reference)
                WHERE external_reference IS NOT NULL;
